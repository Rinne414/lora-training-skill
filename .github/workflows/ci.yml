name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check dataset-doctor lora-pipeline lora-trainer tests
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s dataset-doctor/tests -v
      - run: python -m unittest discover -s lora-pipeline/tests -v
      - run: python -m unittest discover -s lora-trainer/tests -v
      - run: python -m compileall -q dataset-doctor lora-pipeline lora-trainer tools krea2-pipeline
